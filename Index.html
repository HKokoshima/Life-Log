<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Life Reset Log V3</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>body{font-family:sans-serif;background:#f4f6f8;margin:0}.header{background:#4a6cf7;color:#fff;padding:14px;font-weight:bold}.wrap{padding:12px;max-width:900px;margin:auto}.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px}input,textarea{width:100%;box-sizing:border-box;padding:8px;border:1px solid #ccc;border-radius:8px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{background:#4a6cf7;color:#fff;border:none;padding:8px 12px;border-radius:8px;margin:4px}img{max-width:100%}.thumbs img{width:80px;height:80px;object-fit:cover;border-radius:6px}</style></head><body><div class="header">Life Reset Log V3</div><div class="wrap"><div class="card"><p>記録日</p><input id="recordDate" type="date"><p>写真</p><input type="file" id="photoInput" multiple accept="image/*"><div id="photoPreview"></div><p>今日のコメント</p><textarea id="dailyComment"></textarea><div class="row"><div><p>体重(kg)</p><input id="weight" type="number" step="0.1"></div><div><p>睡眠(h)</p><input id="sleep" type="number" step="0.1"></div></div><p>食事記録</p><textarea id="food"></textarea><button class="btn" onclick="saveEntry()">保存</button><button class="btn" onclick="exportJSON()">JSON出力</button><input type="file" id="importFile" accept="application/json"></div><div class="card"><h3>体重グラフ</h3><canvas id="weightChart"></canvas></div><div class="card"><h3>睡眠グラフ</h3><canvas id="sleepChart"></canvas></div><div class="card"><h3>記録一覧</h3><div id="entries"></div></div></div><script>let editingId=null;recordDate.value=new Date().toISOString().split('T')[0];photoInput.onchange=()=>{photoPreview.innerHTML='';[...photoInput.files].forEach((f,i)=>{let r=new FileReader();r.onload=e=>{let d=document.createElement('div');d.innerHTML=`<img src="${e.target.result}" style="max-height:150px"><textarea id="c${i}" placeholder="写真コメント"></textarea><input id="t${i}" placeholder="タグ">`;photoPreview.appendChild(d)};r.readAsDataURL(f);});};function getData(){return JSON.parse(localStorage.getItem('lifeLogV3')||'[]')}function saveData(d){localStorage.setItem('lifeLogV3',JSON.stringify(d))}function fmt(s){let d=new Date(s);let w=['日','月','火','水','木','金','土'];return s+'（'+w[d.getDay()]+'）'}function saveEntry(){let photos=[];document.querySelectorAll('#photoPreview>div').forEach((p,i)=>photos.push({image:p.querySelector('img').src,comment:document.getElementById('c'+i)?.value||'',tags:document.getElementById('t'+i)?.value||''}));let data=getData();let obj={id:editingId||Date.now(),date:recordDate.value,comment:dailyComment.value,weight:weight.value,sleep:sleep.value,food:food.value,photos};if(editingId){data=data.map(x=>x.id===editingId?obj:x);editingId=null;}else{data.unshift(obj);}saveData(data);load();alert('保存しました');}function editEntry(id){let e=getData().find(x=>x.id===id);if(!e)return;editingId=id;recordDate.value=e.date;dailyComment.value=e.comment||'';weight.value=e.weight||'';sleep.value=e.sleep||'';food.value=e.food||'';window.scrollTo(0,0);}function deleteEntry(id){if(!confirm('削除しますか？'))return;let d=getData().filter(x=>x.id!==id);saveData(d);load();}function exportJSON(){let b=new Blob([JSON.stringify(getData(),null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='life-log-'+new Date().toISOString().slice(0,10)+'.json';a.click();}importFile.onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=x=>{saveData(JSON.parse(x.target.result));load();};r.readAsText(f);};let wChart,sChart;function load(){let d=getData();entries.innerHTML='';d.forEach(x=>{let div=document.createElement('div');div.innerHTML=`<hr><b>${fmt(x.date)}</b><button class='btn' onclick='editEntry(${x.id})'>編集</button><button class='btn' onclick='deleteEntry(${x.id})'>削除</button><div>${x.comment||''}</div><div>⚖️${x.weight||'-'}kg 😴${x.sleep||'-'}h</div><div>🍴${x.food||''}</div><div class='thumbs'>${(x.photos||[]).map(p=>`<img src='${p.image}'>`).join('')}</div>`;entries.appendChild(div);});let labels=d.slice().reverse().map(x=>x.date);let weights=d.slice().reverse().map(x=>Number(x.weight)||null);let sleeps=d.slice().reverse().map(x=>Number(x.sleep)||null);if(wChart)wChart.destroy();if(sChart)sChart.destroy();wChart=new Chart(weightChart,{type:'line',data:{labels,datasets:[{label:'体重',data:weights}]}});sChart=new Chart(sleepChart,{type:'line',data:{labels,datasets:[{label:'睡眠',data:sleeps}]}});}load();</script></body></html>
