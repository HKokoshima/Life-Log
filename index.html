<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    
    <title>Life log</title>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#4a6cf7">
 
<script src="https://cdn.jsdelivr.net/npm/chart.js">
</script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>body{font-family:sans-serif;background:#f4f6f8;margin:0}.header{background:#4a6cf7;color:#fff;padding:14px;font-weight:bold}.wrap{padding:12px;max-width:900px;margin:auto}.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px}input,textarea{width:100%;box-sizing:border-box;padding:8px;border:1px solid #ccc;border-radius:8px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{background:#4a6cf7;color:#fff;border:none;padding:8px 12px;border-radius:8px;margin:4px}.thumbs img{width:80px;height:80px;object-fit:cover;border-radius:6px}</style></head><body><div class="header">Life Reset Log V3.1</div><div class="wrap"><div class="card"><p>記録日</p><input id="recordDate" type="date"><p>今日のコメント</p><textarea id="dailyComment"></textarea><div class="row"><div><p>体重(kg)</p><input id="weight" type="number" step="0.1"></div><div><p>睡眠(h)</p><input id="sleep" type="number" step="0.1"></div></div><p>食事記録</p><textarea id="food"></textarea><button class="btn" onclick="saveEntry()">保存</button><button class="btn" onclick="exportJSON()">JSON出力</button><input type="file" id="importFile" accept="application/json"></div><div class="card"><h3>体重グラフ</h3><canvas id="weightChart"></canvas></div><div class="card"><h3>睡眠グラフ</h3><canvas id="sleepChart"></canvas></div><div class="card"><h3>記録一覧</h3><div id="entries"></div></div></div><script>const KEY='LifeResetLog';let editingId=null;recordDate.value=new Date().toISOString().split('T')[0];function migrateData(){let unified=JSON.parse(localStorage.getItem(KEY)||'[]');if(unified.length>0)return;let merged=[];['lifeLog','lifeLogV2','lifeLogV3'].forEach(k=>{let d=JSON.parse(localStorage.getItem(k)||'[]');d.forEach(x=>{if(!x.id)x.id=Date.now()+Math.floor(Math.random()*1000000);merged.push(x);});});localStorage.setItem(KEY,JSON.stringify(merged));}function getData(){return JSON.parse(localStorage.getItem(KEY)||'[]')}function saveData(d){localStorage.setItem(KEY,JSON.stringify(d))}function fmt(s){if(!s)return '';let d=new Date(s);let w=['日','月','火','水','木','金','土'];return s+'（'+w[d.getDay()]+'）';}function saveEntry(){let d=getData();let obj={id:editingId||Date.now(),date:recordDate.value,comment:dailyComment.value,weight:weight.value,sleep:sleep.value,food:food.value};if(editingId){d=d.map(x=>x.id===editingId?obj:x);editingId=null;}else{d.unshift(obj);}saveData(d);load();}function editEntry(id){let e=getData().find(x=>x.id===id);if(!e)return;editingId=id;recordDate.value=e.date||'';dailyComment.value=e.comment||'';weight.value=e.weight||'';sleep.value=e.sleep||'';food.value=e.food||'';}function deleteEntry(id){if(!confirm('削除しますか？'))return;saveData(getData().filter(x=>x.id!==id));load();}function exportJSON(){let b=new Blob([JSON.stringify(getData(),null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='life-log.json';a.click();}importFile.onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=x=>{saveData(JSON.parse(x.target.result));load();};r.readAsText(f);};let wChart,sChart;function load(){let d=getData();entries.innerHTML='';d.forEach(x=>{let div=document.createElement('div');div.innerHTML=`<hr><b>${fmt(x.date)}</b> <button class='btn' onclick='editEntry(${x.id})'>編集</button><button class='btn' onclick='deleteEntry(${x.id})'>削除</button><div>${x.comment||''}</div><div>⚖️${x.weight||'-'}kg 😴${x.sleep||'-'}h</div><div>🍴${x.food||''}</div>`;entries.appendChild(div);});let labels=d.slice().reverse().map(x=>x.date);let weights=d.slice().reverse().map(x=>Number(x.weight)||null);let sleeps=d.slice().reverse().map(x=>Number(x.sleep)||null);if(wChart)wChart.destroy();if(sChart)sChart.destroy();wChart=new Chart(weightChart,{type:'line',data:{labels,datasets:[{label:'体重',data:weights}]}});sChart=new Chart(sleepChart,{type:'line',data:{labels,datasets:[{label:'睡眠',data:sleeps}]}});}migrateData();load();</script></body></html>
