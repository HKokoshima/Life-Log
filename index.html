<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Life Reset Log Mobile</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f4f6f8;margin:0}.header{position:sticky;top:0;background:#4a6cf7;color:#fff;padding:14px;font-weight:bold}.wrap{padding:12px;max-width:700px;margin:auto}.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}input,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:10px;margin-top:4px}button{width:100%;padding:14px;background:#4a6cf7;color:#fff;border:none;border-radius:12px;font-size:16px}.photo-card img{width:100%;border-radius:12px;max-height:260px;object-fit:cover}.entry img{width:90px;height:90px;object-fit:cover;border-radius:8px}.photos{display:grid;gap:12px}.thumbs{display:flex;flex-wrap:wrap;gap:8px}</style></head><body><div class="header">Life Reset Log 📷</div><div class="wrap"><div class="card"><div id="today"></div><br><input type="file" id="photoInput" multiple accept="image/*"><div id="photoPreview" class="photos"></div><p>今日のコメント</p><textarea id="dailyComment" rows="3"></textarea><p>体重(kg)</p><input id="weight" type="number" step="0.1"><p>睡眠時間(h)</p><input id="sleep" type="number" step="0.1"><br><br><button onclick="saveEntry()">保存</button></div><div class="card"><h3>記録一覧</h3><div id="entries"></div></div></div><script>today.textContent=new Date().toLocaleDateString('ja-JP');photoInput.onchange=()=>{photoPreview.innerHTML='';[...photoInput.files].forEach((f,i)=>{let r=new FileReader();r.onload=e=>{let d=document.createElement('div');d.className='photo-card';d.innerHTML=`<img src="${e.target.result}"><textarea id="c${i}" placeholder="写真コメント"></textarea><input id="t${i}" placeholder="タグ">`;photoPreview.appendChild(d)};r.readAsDataURL(f);});};function saveEntry(){let photos=[];document.querySelectorAll('.photo-card').forEach((c,i)=>photos.push({image:c.querySelector('img').src,comment:document.getElementById('c'+i).value,tags:document.getElementById('t'+i).value}));let e={date:new Date().toLocaleDateString('ja-JP'),dailyComment:dailyComment.value,weight:weight.value,sleep:sleep.value,photos};let data=JSON.parse(localStorage.getItem('lifeLogMobile')||'[]');data.unshift(e);localStorage.setItem('lifeLogMobile',JSON.stringify(data));load();alert('保存しました');}function load(){let data=JSON.parse(localStorage.getItem('lifeLogMobile')||'[]');entries.innerHTML='';data.forEach(e=>{let d=document.createElement('div');d.className='entry';d.innerHTML=`<hr><b>${e.date}</b><div>${e.dailyComment||''}</div><div>⚖️ ${e.weight||'-'}kg / 😴 ${e.sleep||'-'}h</div><div class='thumbs'>${e.photos.map(p=>`<div><img src='${p.image}'><div>${p.comment||''}</div></div>`).join('')}</div>`;entries.appendChild(d);});}load();</script></body></html>
