<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Life Reset Log v2</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>body{font-family:sans-serif;background:#f4f6f8;margin:0}.header{background:#4a6cf7;color:#fff;padding:14px;font-weight:bold}.wrap{padding:12px;max-width:900px;margin:auto}.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px}input,textarea{width:100%;box-sizing:border-box;padding:8px;border:1px solid #ccc;border-radius:8px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.photos img{width:100%;max-height:220px;object-fit:cover;border-radius:8px}.photo{margin-top:10px}.btn{background:#4a6cf7;color:#fff;border:none;padding:10px 14px;border-radius:8px;margin:4px}.thumbs img{width:80px;height:80px;object-fit:cover;border-radius:6px}</style></head><body><div class="header">Life Reset Log v2</div><div class="wrap"><div class="card"><div id="today"></div><br><input type="file" id="photoInput" multiple accept="image/*"><div id="photoPreview" class="photos"></div><p>今日のコメント</p><textarea id="dailyComment"></textarea><div class="row"><div><p>体重(kg)</p><input id="weight" type="number" step="0.1"></div><div><p>睡眠(h)</p><input id="sleep" type="number" step="0.1"></div></div><p>食事記録</p><textarea id="food" placeholder="朝・昼・夜など"></textarea><br><button class="btn" onclick="saveEntry()">保存</button><button class="btn" onclick="exportJSON()">JSON出力</button><input type="file" id="importFile" accept="application/json"></div><div class="card"><h3>体重グラフ</h3><canvas id="weightChart"></canvas></div><div class="card"><h3>睡眠グラフ</h3><canvas id="sleepChart"></canvas></div><div class="card"><h3>記録一覧</h3><div id="entries"></div></div></div><script>today.textContent=new Date().toLocaleDateString('ja-JP');photoInput.onchange=()=>{photoPreview.innerHTML='';[...photoInput.files].forEach((f,i)=>{let r=new FileReader();r.onload=e=>{let d=document.createElement('div');d.className='photo';d.innerHTML=`<img src="${e.target.result}"><textarea id="c${i}" placeholder="写真コメント"></textarea><input id="t${i}" placeholder="タグ">`;photoPreview.appendChild(d)};r.readAsDataURL(f);});};function getData(){return JSON.parse(localStorage.getItem('lifeLogV2')||'[]')}function saveData(d){localStorage.setItem('lifeLogV2',JSON.stringify(d))}function saveEntry(){let photos=[];document.querySelectorAll('.photo').forEach((p,i)=>photos.push({image:p.querySelector('img').src,comment:document.getElementById('c'+i).value,tags:document.getElementById('t'+i).value}));let e={date:new Date().toLocaleDateString('ja-JP'),comment:dailyComment.value,weight:weight.value,sleep:sleep.value,food:food.value,photos};let d=getData();d.unshift(e);saveData(d);load();alert('保存しました');}function exportJSON(){let blob=new Blob([JSON.stringify(getData(),null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='life-log.json';a.click();}importFile.onchange=(ev)=>{const f=ev.target.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{saveData(JSON.parse(e.target.result));load();alert('インポート完了');};r.readAsText(f);};let wChart,sChart;function load(){let d=getData();entries.innerHTML='';d.forEach(x=>{let div=document.createElement('div');div.innerHTML=`<hr><b>${x.date}</b><div>${x.comment||''}</div><div>⚖️${x.weight||'-'}kg 😴${x.sleep||'-'}h</div><div>🍴${x.food||''}</div><div class='thumbs'>${(x.photos||[]).map(p=>`<img src='${p.image}'>`).join('')}</div>`;entries.appendChild(div);});let labels=d.slice().reverse().map(x=>x.date);let weights=d.slice().reverse().map(x=>Number(x.weight)||null);let sleeps=d.slice().reverse().map(x=>Number(x.sleep)||null);if(wChart)wChart.destroy();if(sChart)sChart.destroy();wChart=new Chart(document.getElementById('weightChart'),{type:'line',data:{labels,datasets:[{label:'体重',data:weights}]}});sChart=new Chart(document.getElementById('sleepChart'),{type:'line',data:{labels,datasets:[{label:'睡眠時間',data:sleeps}]}});}load();</script></body></html>
